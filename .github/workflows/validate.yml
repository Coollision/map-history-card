name: Validate

on:
  push:
    branches-ignore: [main] # main is validated by release.yml, before it can release
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check map-history-card.js
      - name: Translations are complete
        run: node scripts/check-translations.mjs
  bundle:
    name: Release bundle builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Bundle has the card and MapLibre, and loads nothing from a CDN
        run: |
          for f in dist/map-history-card.js dist/maplibre/maplibre-gl.mjs dist/maplibre/maplibre-gl-worker.mjs dist/maplibre/maplibre-gl.css; do
            [ -s "$f" ] || { echo "missing $f"; exit 1; }
          done
          if grep -En "https?://(cdn\.jsdelivr|unpkg)" dist/map-history-card.js; then echo "CDN URL in card"; exit 1; fi
          if grep -rEn "(from|import\()[ ]*[\"']https?://" dist; then echo "remote import in bundle"; exit 1; fi
