name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check map-history-card.js
  cdn:
    name: CDN assets exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: MapLibre files are reachable on jsDelivr
        run: |
          v=$(sed -n 's/^const MAPLIBRE_VERSION = "\(.*\)";/\1/p' map-history-card.js)
          echo "MapLibre $v"
          for f in maplibre-gl.js maplibre-gl.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cdn.jsdelivr.net/npm/maplibre-gl@$v/dist/$f")
            echo "$f -> $code"
            [ "$code" = 200 ] || exit 1
          done
